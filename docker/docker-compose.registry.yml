# 使用私有镜像仓库中的 Web / Worker 镜像，而不是在部署机上 docker build。
#
# 与以下任一文件叠加使用：
#   docker compose -f docker-compose.yml -f docker-compose.registry.yml pull web worker
#   docker compose -f docker-compose.yml -f docker-compose.registry.yml up -d --no-build
#
# 或使用脚本（推荐，已包含 pull 与 --no-build）：
#   bash docker/start-from-registry.sh
#   bash docker/start-from-registry.sh --secrets
#
# 主 compose 仍为 web/worker 定义了 build；合并后 build 段仍存在，因此必须用
#   --no-build
# 否则 compose 可能优先走本地构建。升级版本前先 pull 再 up --no-build。
#
# 环境变量（可写入项目根目录 .env）：
#   PIS_WEB_IMAGE     默认 hub.albertzhan.top/pis/web:latest（可改为 Docker Hub 等任意 Registry 全名）
#   PIS_WORKER_IMAGE  默认 hub.albertzhan.top/pis/worker:latest
#
# 部署机在 .env 中只填「实际要从哪拉」的一套地址；构建机可同时 push 到私有与 Hub，
# 见 DOCKER_COMPOSE_FILES.md「多 Registry 推送」与 docker/push-images-to-registries.sh。
#
# 部署前在目标机登录对应 Registry，例如：
#   docker login hub.albertzhan.top
#   docker login              # Docker Hub（registry-1.docker.io）

services:
  web:
    image: ${PIS_WEB_IMAGE:-hub.albertzhan.top/pis/web:latest}

  worker:
    image: ${PIS_WORKER_IMAGE:-hub.albertzhan.top/pis/worker:latest}
