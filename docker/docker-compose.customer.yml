# =============================================================================
# PIS 单文件合并入口（默认栈 + Registry 预构建 web/worker）
# =============================================================================
# 将主栈与「仅镜像」覆盖作为一组 path 引入，避免「include 多个文件再在本文件写
# services」导致的 conflicts with imported resource。
#
# 使用前：上一级目录放置 .env；已 docker login 私有仓库（若需要）。
#
#   cd docker
#   docker compose -f docker-compose.customer.yml pull web worker
#   docker compose -f docker-compose.customer.yml up -d --no-build
#
# 需要 Docker Compose v2.20+，且支持 include 的 path 列表合并（见官方文档 Include）。
# 若本文件在你使用的 Compose 版本上报错，请改用：
#   bash start-from-registry.sh
# =============================================================================

name: pis

include:
  - path:
      - docker-compose.yml
      - docker-compose.registry.yml
